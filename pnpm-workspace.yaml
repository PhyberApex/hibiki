minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
# Old, pre-provenance versions pulled in transitively by unmaintained tooling deps
# (electron-installer-dmg -> appdmg -> execa@1 -> cross-spawn@6; babel 7.x via
# vite-plugin-vue-devtools; @electron-forge/cli's pinned @inquirer/* -> @types/node).
# No upstream release avoids these; verified not exploitable, dev-only tooling.
trustPolicyExclude:
  - semver@5.7.2
  - semver@6.3.1
  - undici-types@6.21.0

nodeLinker: hoisted
shamefullyHoist: true
shellEmulator: true

# @electron/rebuild@3.7.0 (via @electron-forge/cli -> @electron-forge/core-utils)
# pins @electron/node-gyp to a git tarball instead of a registry range, which pnpm
# treats as an exotic subdependency and refuses to re-resolve. @electron/rebuild@4.x
# fixes this upstream by switching to registry node-gyp, but core-utils/cli only pick
# up rebuild@^4.0.1 starting in the 8.0.0-alpha line (no stable release yet as of
# electron-forge/cli@7.11.2). Force resolution to the equivalent registry-published
# version so it stops being exotic; revisit once forge/cli ships stable on rebuild@4.
overrides:
  '@electron/node-gyp': npm:@electron/node-gyp@10.2.0-electron.2
  # @discordjs/voice@0.19.2 pins its own nested ws@8.19.0, which is the copy the
  # Discord voice gateway actually loads (the hoisted top-level ws is not what voice
  # resolves). 8.19.0 carries GHSA-96hv-2xvq-fx4p (fragment memory exhaustion, fixed
  # in 8.21.0) and GHSA-58qx-3vcg-4xpx (uninitialized memory disclosure, fixed in
  # 8.20.1). Force every ws onto the patched line; drop once voice widens its range
  # (#777). Mirrored in e2e/pnpm-workspace.yaml: drop both together.
  ws: ^8.21.1

patchedDependencies:
  cross-zip@4.0.1: patches/cross-zip@4.0.1.patch

allowBuilds:
  '@discordjs/opus': false
  '@parcel/watcher': true
  '@snazzah/davey': true
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  lzma-native: true
  macos-alias: true
  unrs-resolver: true
