<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{% if page.title and page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/social.png">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0d0e13">
  <link rel="icon" href="{{ site.baseurl }}/logo.png" type="image/png">
  <link rel="preload" href="{{ site.baseurl }}/assets/fonts/AlegreyaSans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ site.baseurl }}/assets/fonts/AlegreyaSans-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/fonts.css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/site.css">
  {% if site.umami.script_url and site.umami.website_id %}
  <script defer src="{{ site.umami.script_url }}" data-website-id="{{ site.umami.website_id }}"></script>
  {% endif %}
</head>
<body class="{% if page.url == "/" or page.url == "/index.html" %}page-home{% else %}page-read{% endif %}">
<!--
THESIS: Hibiki's site is one battle map. Sound sources are glowing radii on the grid and the app is what lights them. It refuses the category's banner-plus-feature-cards stack.
OWN-WORLD: charcoal dry-erase vinyl (#0d0e13) with a 1-inch grid in warm off-white at 5% and a lamp pool of amber top-left; music amber, ambience teal, effects rose own the only saturated fields; Alegreya Sans for copy, Alegreya Sans SC for map labels; no boxed cards, regions sit on the shared grid; the download is the single framed object.
STORY: a GM lands, recognises the map, sees three overlapping sound radii around a party token, reads one line about what Hibiki does, downloads, then scrolls into the real Cozy Tavern board, the legend of everything else, the three-step bot setup, and the scene packs.
FIRST VIEWPORT: nav strip on the map; left column headline, one-line pitch, framed Download with platform links; right column the radii composition (amber r190, teal r170, rose r120) overlapping on the party token with VTT-style labels; the radii light in sequence then breathe.
FORM: The Battle Map, candidate 3 of the grounded list, seed 5910cefa, code-led.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <a href="{{ site.baseurl }}/" class="brand">
    <span class="brand-token"><img src="{{ site.baseurl }}/logo.png" alt="" width="40" height="40"></span>
    <span class="brand-name">Hibiki <span class="brand-kanji" aria-hidden="true">響</span></span>
  </a>
  <nav class="site-nav" aria-label="Main">
    <a href="{{ site.baseurl }}/#scenes">Scenes</a>
    <a href="{{ site.baseurl }}/#setup">Setup</a>
    <a href="{{ site.baseurl }}/scene-sharing"{% if page.url contains "scene-sharing" %} aria-current="page"{% endif %}>Scene sharing</a>
    <a href="{{ site.baseurl }}/compare"{% if page.url contains "compare" %} aria-current="page"{% endif %}>Compare</a>
    <a href="https://github.com/PhyberApex/hibiki" class="nav-github">GitHub</a>
  </nav>
</header>

<main id="main" class="site-main">
{{ content }}
</main>

<footer class="site-footer">
  <p class="footer-line"><span class="footer-name">Hibiki</span> is free and open source under the MIT license. Made by <a href="https://github.com/PhyberApex">PhyberApex</a>.</p>
  <p class="footer-links"><a href="https://github.com/PhyberApex/hibiki">Source</a><a href="https://github.com/PhyberApex/hibiki/releases">Releases</a><a href="https://github.com/PhyberApex/hibiki/issues">Issues</a><a href="https://github.com/PhyberApex/hibiki-scene-packs">Scene packs</a><a href="{{ site.baseurl }}/privacy">Privacy</a></p>
</footer>
<script src="{{ site.baseurl }}/assets/js/site.js" defer></script>
</body>
</html>
