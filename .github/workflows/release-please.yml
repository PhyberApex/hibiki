name: Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: release-please
  cancel-in-progress: false

# Read-only by default (#781); jobs that write widen it for themselves.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        # A PAT, not GITHUB_TOKEN, so the release PR's checks run: a fine-grained
        # token on this repo only, with contents, pull requests and issues
        # (labels) write. The action is SHA-pinned because it receives it (#781).
        with:
          token: ${{ secrets.GH_PAT }}

  release-notes:
    # After build-release: its release upload rewrites the release and could
    # drop an edit made at the same time. always() so a failed Windows job
    # still leaves the policy on the release.
    if: always() && needs.release-please.outputs.release_created == 'true'
    needs: [release-please, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Append the Code signing policy to the release notes
        run: .github/scripts/append-release-policy.sh "${{ needs.release-please.outputs.tag_name }}"
        env:
          GH_TOKEN: ${{ github.token }}

  checks:
    if: needs.release-please.outputs.release_created == 'true'
    needs: release-please
    uses: ./.github/workflows/checks.yml

  build-release:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, checks]
    uses: ./.github/workflows/build.yml
    # A called workflow can only narrow the caller's grant: its upload-release
    # job needs contents: write, its build job drops back to read.
    permissions:
      contents: write
    with:
      upload_release: true
      tag_name: ${{ needs.release-please.outputs.tag_name }}
