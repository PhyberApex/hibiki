name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_call:
    inputs:
      upload_release:
        description: Upload artifacts to a GitHub Release
        type: boolean
        default: false
      tag_name:
        description: Release tag to upload assets to
        type: string
        default: ''

# Read-only by default (#781): the build job runs dependency-supplied code
# (pnpm install, vite, electron-forge), so its token cannot write. Only
# upload-release, which runs no repo code, gets contents: write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            dist_script: dist:mac
          - os: windows-latest
            platform: win
            dist_script: dist:win
          - os: ubuntu-latest
            platform: linux
            dist_script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0

      # Packaging stays on Node 24 while dev and the other workflows run the
      # .nvmrc Node 26: newer majors removed fs.rmdir's `recursive` option,
      # which maker-zip's cross-zip still calls on win32, so the Windows make
      # step fails on Node 26 (#705). renovate.json caps this file's Node below
      # 25; lift both once cross-zip switches to fs.rm.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package
        run: pnpm run ${{ matrix.dist_script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hibiki-${{ matrix.platform }}
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
            out/make/**/*.exe
            out/make/**/*.AppImage
            out/make/**/*.deb
          if-no-files-found: error

  # Separate from build so the write-scoped token never shares a job with
  # dependency code. !cancelled() keeps the old fail-fast: false behaviour: a
  # failed platform still lets the others reach the release.
  upload-release:
    if: ${{ !cancelled() && inputs.upload_release && inputs.tag_name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hibiki-*
          path: release-assets
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag_name }}
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
