coverage:
  status:
    project:
      default:
        target: 75%
        threshold: 1%
    patch:
      default:
        target: 80%

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: backend
      paths:
        - src/
        - electron/
    - name: frontend
      paths:
        - frontend/src/

comment:
  layout: 'reach,diff,flags,tree'
  behavior: default
  require_changes: false
